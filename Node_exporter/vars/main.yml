---

mapping_architecture:
  aarch64: "arm64"
  x86_64: "amd64"

system_major_version: ""
node_exporter_port: 50420
node_exporter_os_architecter: "{{ [ansible_architecture] | map('extract', mapping_architecture) | first }}"
node_exporter_relative_path: "{{ node_exporter_version  | regex_replace('^v', '') }}.linux-{{ node_exporter_os_architecter }}"
node_exporter_release_path: "https://github.com/prometheus/node_exporter/releases/download/{{ node_exporter_version }}/node_exporter-{{ node_exporter_relative_path }}.tar.gz"

node_exporter_user: "node_exporter"
node_exporter_group: "node_exporter"

node_exporter_unit_path: "/usr/lib/systemd/system/node_exporter.service"
node_exporter_conf_path: "/etc/node_exporter/web-config.yml"
node_exporter_bin_path: "/usr/local/bin"