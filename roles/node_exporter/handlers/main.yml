---
- name: Reload Service
  become: true 
  ansible.builtin.systemd_service:
    daemon_reload: true
    listen: "Daemon reload"
    
- name: Restart node_exporter Service:
  become: true
  ansible.builtin.systemd_service:
    name: "node_exporter"
    enabled: true
    state: "restarted"
    listen: "Restart node_exporter"
